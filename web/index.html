<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PixelForge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>PixelForge</h1>
      <p class="subtitle">Gerador local de imagens por IA — 100% offline</p>
    </header>

    <section class="panel">
      <label for="prompt" class="label">Prompt</label>
      <textarea
        id="prompt"
        class="prompt-input"
        rows="4"
        placeholder="Descreva a imagem que você quer gerar..."
        autofocus
      ></textarea>

      <div class="actions">
        <button id="generate-btn" class="generate-btn">Gerar</button>
        <span class="hint">Ctrl+Enter também gera</span>
      </div>

      <details id="advanced" class="advanced">
        <summary>Avançado</summary>
        <div class="advanced-grid">
          <label class="field">
            <span>Prompt negativo</span>
            <textarea id="negative-prompt" rows="2" placeholder="O que evitar na imagem"></textarea>
          </label>

          <label class="field">
            <span>Largura</span>
            <input id="width" type="number" min="64" max="2048" step="64" value="512" />
          </label>

          <label class="field">
            <span>Altura</span>
            <input id="height" type="number" min="64" max="2048" step="64" value="512" />
          </label>

          <label class="field">
            <span>Passos</span>
            <input id="steps" type="number" min="1" max="150" value="25" />
          </label>

          <label class="field">
            <span>CFG (guidance scale)</span>
            <input id="guidance" type="number" min="0" max="30" step="0.5" value="7.5" />
          </label>

          <label class="field">
            <span>Quantidade</span>
            <input id="num-images" type="number" min="1" max="4" value="1" />
          </label>

          <label class="field">
            <span>Seed (-1 = aleatória)</span>
            <input id="seed" type="number" value="-1" />
          </label>
        </div>
      </details>
    </section>

    <section class="result-panel">
      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-label" class="progress-label">Gerando…</span>
      </div>

      <div id="error-box" class="error-box hidden"></div>

      <div id="gallery" class="gallery"></div>
    </section>

    <footer class="footer">
      <span id="status-line">Carregando status…</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
